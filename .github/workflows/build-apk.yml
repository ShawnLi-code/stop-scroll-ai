name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.0.1.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.0.1-APK
          path: release_output/StopScrollAI-v1.0.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.1
          name: StopScroll AI v1.0.1 修复版 (解决Android 14无障碍启动异常)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.0.1 修复版
            
            #### 修复内容：
            - **解决 ColorOS / Android 14+ 上无障碍服务报错“无法运行，点按即可查看相关信息”的问题**；
            - 移除高版本系统对前台服务类型的冲突，采用系统级原生守护；
            - 全面加强无障碍事件监听与节点提取的异常防御，杜绝闪退。
          files: release_output/StopScrollAI-v1.0.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
