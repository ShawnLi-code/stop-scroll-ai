name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.0.9.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.0.9-APK
          path: release_output/StopScrollAI-v1.0.9.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.9
          name: StopScroll AI v1.0.9 (自定义选择手机任意应用 + 微信视频号/朋友圈精准拦截 + 永久签名无损覆盖)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.0.9 重磅自律升级
            
            #### 核心重磅升级：
            1. **📱 自由选择手机里的任意已安装应用 (自定义 App 选择器)**：
               - 新增「➕ 从手机中选择更多已安装应用」页面；
               - 支持搜索手机内所有已安装的应用（Twitter/X、游戏、论坛、资讯等），任意勾选一键纳入自律监控；
               - 主页动态显示所有已选应用，支持便捷管理与移除保护。
            2. **💚 微信子功能专属精准拦截（沉迷功能精确管控，绝不影响正常聊天）**：
               - 📺 **微信视频号**：精准识别并拦截视频号沉迷，不影响微信聊天；
               - 📸 **微信朋友圈**：精准拦截刷朋友圈动态，不影响日常收发消息与微信支付；
            3. **🔑 永久固定统一签名密钥（彻底告别卸载重装，无损覆盖升级）**：
               - 固化项目永久开发者签名密钥，所有后续升级直接覆盖，100%保留所有历史统计、API配置与系统权限！
            4. **🔄 应用内一键在线检查更新与自动安装**：
               - 主页顶部一键检测新版，在线极速下载并通过系统安装器直接覆盖升级；
            5. **🤖 AI 打开理由严格审核打回 (告别随便输单字)**：
               - 严厉打回单字、无意义乱码、模糊敷衍借口与纯娱乐沉迷借口！
            6. **🌙 夜间宵禁防破戒刚性安全锁 (彻底杜绝深夜刷到凌晨1点)**：
               - 夜间宵禁时段（23:00 - 06:00）刚性死锁，严禁关闭宵禁与解除监控！
            7. **🎁 国内永久免费 AI 大模型一键预设 (智谱 GLM-4-Flash 永久免费)**：
               - 0元无费用，国内直连无需梯子，延迟仅200ms。
          files: release_output/StopScrollAI-v1.0.9.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
