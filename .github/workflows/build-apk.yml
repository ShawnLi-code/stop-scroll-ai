name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.0.4.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.0.4-APK
          path: release_output/StopScrollAI-v1.0.4.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.4
          name: StopScroll AI v1.0.4 (刚性主动倒计时打断 + 防手滑划掉保护)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.0.4
            
            #### 核心重磅升级：
            1. **刚性主动倒计时打断（不配置 AI 也 100% 准时生效）**：
               - 移除了过去依赖屏幕触摸的被动检测机制，改用系统级 Handler 主动定时器；
               - 无论在刷什么视频，时间一到毫秒级主动强震动 + 弹出全屏「⏰ 专注时间已到！」红色卡片，当场打断，绝不错过；
            2. **防手滑误划掉杀后台机制**：
               - 主界面设置 `excludeFromRecents="true"`，不出现在最近多任务列表中，想误划都划不掉！
               - 保护无障碍服务不被误杀断连；
            3. **全新的即勾即存反馈与监控看板**：
               - 勾选应用即刻提示生效；
               - 增加「🎯 当前已受控应用列表」状态看板与底部全局保存大按钮。
          files: release_output/StopScrollAI-v1.0.4.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
