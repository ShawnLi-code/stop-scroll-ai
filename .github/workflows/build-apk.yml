name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/FocusFlow-v1.2.1.apk
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.2.1.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusFlow-v1.2.1-APK
          path: release_output/FocusFlow-v1.2.1.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.1
          name: 定心 (FocusFlow) v1.2.1 (全品牌升级更名「定心」+ 极光心流环内外全息Logo同步 + 视觉对比度优化)
          body: |
            ### 🌟 定心 (FocusFlow) v1.2.1 品牌与视觉焕新发布

            #### 核心焕新内容：
            1. **✨ 正式更名为「定心」(FocusFlow)**：
               - 告别生硬负向的“别刷了”，升级为充满禅意、专注与从容的「定心」；
               - 寓意心定神闲、掌控自我，抵御短视频信息流的浮躁与喧嚣。
            2. **🪐 全新极光心流环 (Zen Flow Ring) Logo，内外界面完全同步**：
               - 手机桌面图标：采用翡翠绿与电光紫双弧旋流、内嵌清亮微星与四芒聚光核心，极简高级；
               - 应用内部顶栏与拦截面板：全面同步嵌入该矢量心流徽标，彻底告别粗糙纯黑与生硬 emoji！
            3. **👀 按钮与卡片高对比度视觉修复**：
               - 针对“检查更新”按钮在暗底绿框上字色偏暗的问题，全面优化为高清晰度明亮白字，清晰醒目；
               - 优化配额总和与模型推荐说明的文本对比度，全场景保证高可读性。
            4. **⏱️ 90分钟健康总预算 & 分应用规划自由支配 (配额内免审畅刷)**；
            5. **🍎 苹果手机 (iPhone) 原生自律与防沉迷设置指南**；
            6. **🔑 永久固定签名证书，支持应用内一键无损覆盖更新（API Key、历史数据与系统权限 100% 完整保留）**！
          files: |
            release_output/FocusFlow-v1.2.1.apk
            release_output/StopScrollAI-v1.2.1.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
