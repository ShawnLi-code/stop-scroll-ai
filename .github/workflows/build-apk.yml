name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.0.6.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.0.6-APK
          path: release_output/StopScrollAI-v1.0.6.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.6
          name: StopScroll AI v1.0.6 (使用历史与自律统计看板 + 按日按月汇总 + 单次明细记录)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.0.6
            
            #### 核心重磅升级：
            1. **📊 每次打开短视频明细记录 (本地 SQLite 存储)**：
               - 每次带着目标进入应用时，自动记录应用名称、声明目标、选定使用时长和具体时间；
            2. **📈 按日与按月使用时长总汇总看板**：
               - 当日累计受控用时统计（如：X 小时 Y 分钟）与打开次数；
               - 全月累计时长与总次数聚合；
               - 主界面置顶显示「📊 今日自律战报」，一目了然；
            3. **📅 日历与日期自由筛选**：
               - 提供日历日期选择器（可查询以往任意一天的使用记录）与「今天 / 昨天 / 前天」快捷按钮。
          files: release_output/StopScrollAI-v1.0.6.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
