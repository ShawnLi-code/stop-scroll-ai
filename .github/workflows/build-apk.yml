name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.1.0.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.1.0-APK
          path: release_output/StopScrollAI-v1.1.0.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.1.0
          name: StopScroll AI v1.1.0 (AI 综合全天时长与理由防沉迷监控 + 今日限额熔断与紧急特批机制)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.1.0 重磅自律决策升级
            
            #### 核心重磅升级：
            1. **🧠 AI 全天使用时长与理由综合监控 (拒绝温水煮青蛙)**：
               - AI 不再只孤立审核当前单次理由，而是**全面结合今天累计已用的总时长、今日打开频次、以及今天此前所有的理由记录**！
               - 智能评估当前是否已处于认知疲劳和高频沉迷状态，综合判断今天是否还能再刷；
            2. **🛑 今日自律限额刚性熔断 (超标后常规理由一律驳回)**：
               - 主页支持自定义每日自律上限（默认 60 分钟，支持 30m、60m、90m、120m 或自定义）；
               - 当今日累计时长达到上限后，AI 启动强力自律熔断，所有常规消遣借口（哪怕是“学习”、“查资料”、“做饭”等）一律驳回并给出犀利警醒，坚决防止自我欺骗；
            3. **🚨 紧急突发重大要事特批放行机制**：
               - 当今日额度超限被熔断后，若确有不可延误的突发紧急要事（如线上突发故障、重要商务签约紧急回复、突发紧急联络等），可申请紧急特批；
               - AI 将进行极严苛的突发紧急度审查，仅对确凿紧急事项破例放行，并在规定时间内严格收尾；
            4. **⏰ 刚性超时智能疲劳度诊断与警醒**：
               - 倒计时时间一到，系统主动分析今日累计消耗的总精力与总时间，如果今日额度已透支，直接给出深度警醒并禁止继续刷屏；
            5. **📱 自由勾选手机里的任意应用 + 微信视频号/朋友圈精准拦截**；
            6. **🔑 永久固定签名证书，支持应用内一键无损覆盖升级，数据与权限永久保留**！
          files: release_output/StopScrollAI-v1.1.0.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
