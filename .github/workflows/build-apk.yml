name: Build and Release StopScroll APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: 8.7

      - name: Build Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Rename and Prepare APK
        run: |
          mkdir -p release_output
          cp app/build/outputs/apk/release/app-release.apk release_output/StopScrollAI-v1.0.3.apk
          ls -lh release_output/

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: StopScrollAI-v1.0.3-APK
          path: release_output/StopScrollAI-v1.0.3.apk

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.3
          name: StopScroll AI v1.0.3 正式验证版 (支持Chrome等测试应用与完全防闪退)
          body: |
            ### 🛡️ 别刷了 AI (StopScroll AI) v1.0.3
            
            #### 本次更新：
            1. **导出 InterceptDialogActivity**：确保系统与无障碍服务唤起弹窗不受任何权限冲突；
            2. **预设支持 Chrome 浏览器**：方便在没有安装小红书/抖音的设备或模拟器上快速测试拦截；
            3. **弹窗防抖与全屏深色沉浸**：彻底杜绝瞬间闪退回桌面的问题。
          files: release_output/StopScrollAI-v1.0.3.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
